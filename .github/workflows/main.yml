name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ветка CommonLibSSE-NG, если репозиторий не содержит сабмодуль
  COMMONLIB_REF: ng
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch CommonLibSSE-NG (если нет сабмодуля)
        shell: pwsh
        run: |
          if (-not (Test-Path "extern/CommonLibSSE-NG/CMakeLists.txt")) {
            git clone --depth 1 --branch $env:COMMONLIB_REF https://github.com/alandtse/CommonLibSSE-NG.git extern/CommonLibSSE-NG
          }

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter "VanillaDirectionalDodge.dll" | Select-Object -First 1
          if (-not $dll) { throw "DLL не найдена" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force package/* dist/
          Copy-Item $dll.FullName dist/SKSE/Plugins/
          Get-ChildItem dist -Recurse -File | ForEach-Object { $_.FullName }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanillaDirectionalDodge
          path: dist/**

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath VanillaDirectionalDodge.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VanillaDirectionalDodge.zip
