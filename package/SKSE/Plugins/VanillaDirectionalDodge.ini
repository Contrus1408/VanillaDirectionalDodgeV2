[General]
; Dodge key: DirectInput scancode (decimal). 47 = V, 46 = C, 56 = left Alt.
Key=47

; Minimum delay between dodge attempts, milliseconds (100-5000).
CooldownMs=650

; Turn the character toward WASD relative to the camera before rolling.
RotateToInput=1

; Temporarily enter sneak so the vanilla roll animation can be requested.
; If you are already sneaking, the plugin leaves sneak enabled.
TemporarySneak=1

; Delay before requesting the roll after SneakStart, milliseconds (0-500).
SneakEnterDelayMs=100

; Fallback duration before restoring temporary sneak, milliseconds (300-2500).
; This is a fallback because the vanilla graph does not expose a reliable
; universal roll-finished event across all behavior setups.
RollDurationMs=900

; Restore the previous camera perspective if the animation changed it.
RestoreCamera=1

; Diagnostic animation-graph logging.
LogGraphEvents=0

; Animation graph events to try in order, comma-separated.
RollEvents=SneakSprintStartRoll

; Events used to temporarily enter/leave sneak.
SneakStartEvent=SneakStart
SneakStopEvent=SneakStop
