[General]
; Клавиша уворота - DirectInput scancode (десятичное число).
; 47 = V, 46 = C, 56 = левый Alt, 57 = Пробел, 29 = левый Ctrl, 15 = Tab
Key=47

; Пауза между перекатами, мс
CooldownMs=800

; 1 = перед перекатом развернуть персонажа по нажатым WASD (относительно камеры)
; 0 = катиться туда, куда персонаж смотрит сейчас
RotateToInput=1

; Анимационные события ванильного переката. Можно несколько через запятую:
; плагин пробует их по очереди, пока игра не примет одно (см. SKSE\VanillaDirectionalDodge.log)
RollEvents=SneakSprintStartRoll
